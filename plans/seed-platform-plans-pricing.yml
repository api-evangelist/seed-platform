specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Seed
providerId: seed-platform
generated: '2026-08-28'
method: searched
source: https://www.cantaloupe.com/pricing/
created: '2026-05-04'
modified: '2026-08-28'
supersedes: >-
  A 2026-05-04 bulk-sweep scaffold that invented free/professional/enterprise
  tiers with fabricated request quotas. Cantaloupe publishes no such tiers. The
  scaffold has been replaced with what the provider actually publishes.
tags:
  - Payments
  - Vending
  - Hardware
description: >-
  Cantaloupe publishes three hardware acquisition models on its pricing page and
  a public hardware store with listed prices. It publishes NO price, quota, or
  subscription tier for the Seed API or for Seed software — every software and
  service figure is "monthly service fees apply" or "talk to sales." There is no
  self-serve API plan.
sources:
  - https://www.cantaloupe.com/pricing/
  - https://www.cantaloupe.com/pricing/cantaloupe-one/
  - https://store.cantaloupe.com/
  - https://www.cantaloupe.com/products/integrations/seed-api/
api_plans_published: false
api_plans_note: >-
  The Seed API product page carries no pricing, no plan table, and no sign-up —
  only "Contact Us" and a phone number. Nothing on any Cantaloupe page attaches a
  price, a call quota, or a tier to API access.
plans:
  - id: seed-platform-purchase-outright
    name: Purchase outright
    type: one-time-purchase
    description: >-
      Buy devices outright and manage the assets on your own balance sheet.
      Cantaloupe states "competitive card reader prices," that "monthly service
      fees apply," and that additional services can be added on.
    price: null
    currency: USD
    billing_period: one-time hardware + recurring service fee
    price_note: >-
      Hardware prices are published on store.cantaloupe.com (e.g. Smart Store
      600 Single $7,495.00; Card Reader Extension Cable 10' $10.00). The
      recurring monthly service fee is referenced but never quantified.
    entries: []
    cta: https://store.cantaloupe.com/
  - id: seed-platform-finance
    name: Finance your hardware
    type: financed
    description: >-
      Own the hardware while spreading cost over time. Fixed monthly payment
      upon credit approval; monthly service fees apply; additional services can
      be added on.
    price: null
    currency: USD
    billing_period: monthly
    price_note: No rate, term, or fee schedule is published; routed to sales.
    entries: []
    cta: https://www.cantaloupe.com/pricing/finance-inquiry/
  - id: seed-platform-cantaloupe-one
    name: Cantaloupe One
    type: subscription-bundle
    description: >-
      Bundled subscription with "$0 upfront costs," fixed monthly bundled fees
      covering hardware, software and service, full hardware warranty and
      replacement during the agreement, vending management software included,
      and flexible bundling of additional services.
    price: null
    currency: USD
    billing_period: monthly
    price_note: >-
      "All for one simple monthly fee" — the figure is never stated. Cantaloupe
      also states the subscription is not charged until the next billing cycle
      after start.
    included:
      - Modern hardware (card readers, kiosks, Smart Stores)
      - Vending management software
      - Full hardware warranty and replacement
      - Extended warranty during agreement
    entries: []
    cta: https://www.cantaloupe.com/pricing/cantaloupe-one/
plan_count: 3
plan_count_note: >-
  Three named commercial models are published. Zero of them carry a published
  price, and none of them is an API plan.
