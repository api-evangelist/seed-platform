description: >-
  Seed is Cantaloupe's cloud platform for self-service and unattended retail —
  vending, micro markets, office coffee and pantry, amusement, and laundry. The
  Seed family spans Seed Live (device management bundled with a Cantaloupe card
  reader), Seed Cashless+, Seed Pro (route, warehouse, planogram and analytics
  management), Seed Markets and Seed Delivery. The Seed API is Cantaloupe's
  integration surface for connecting third-party point-of-sale and self-service
  equipment to those cloud services: cashless payment acceptance across major
  card brands, digital and mobile wallets and NFC through a single gateway;
  consolidated billing that compiles transactions, fees and payments into one
  bill across business channels; and real-time sales data exposed as
  performance, payment-mix and profitability reporting across an operator's
  fleet. Cantaloupe publishes no public developer portal, API reference, base
  URL, authentication guide or machine-readable contract for the Seed API —
  access is arranged through Cantaloupe sales and support.
