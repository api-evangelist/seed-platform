specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Seed
providerId: seed-platform
generated: '2026-08-28'
method: searched
source: >-
  Full search of www.cantaloupe.com (sitemap-driven), the Seed API product page,
  the help centre, and the live api.seedlive.com host.
created: '2026-05-04'
modified: '2026-08-28'
supersedes: >-
  A 2026-05-04 bulk-sweep scaffold that published invented per-minute and
  per-month quotas (10/min free, 100/min professional, 1000/min enterprise) and
  an invented X-RateLimit-* header set for an API that documents none of it. The
  scaffold is removed. This file records the honest zero.
tags:
  - Payments
  - Rate Limiting
description: >-
  Cantaloupe publishes no rate limits for the Seed API. There is no API
  reference, no developer portal, and no machine-readable contract in which a
  limit or a response header could be documented, and the live API host is
  gated to anonymous callers so no limit signal can be observed either.
limits: []
limit_count: 0
headers: {}
headers_note: >-
  No rate-limit response headers are documented. None could be observed:
  api.seedlive.com (AWS API Gateway) answers every anonymous request with HTTP
  403 and the body {"message":"Missing Authentication Token"}, carrying no
  RateLimit-*, X-RateLimit-* or Retry-After header.
responseCodes: {}
policies: []
evidence:
  - url: https://www.cantaloupe.com/products/integrations/seed-api/
    status: 200
    finding: Product/marketing page; no limits, no reference, no base URL.
  - url: https://www.cantaloupe.com/sitemap_index.xml
    status: 200
    finding: >-
      95 pages and 93 help articles enumerated; no developer, API-reference or
      rate-limit page exists on the site.
  - url: https://api.seedlive.com/
    status: 403
    finding: >-
      {"message":"Missing Authentication Token"} — no rate-limit headers on the
      anonymous response.
maintainers: []
